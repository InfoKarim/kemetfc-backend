name: quality-and-security

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trainingbuddy
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: trainingbuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trainingbuddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://trainingbuddy:test-password@localhost:5432/trainingbuddy_test
      AUTH_COOKIE_SECURE: "false"
      VIDEO_STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest --cov=app --cov=main --cov-fail-under=85
      - run: ruff check app main.py scripts tests
      - run: bandit -q -r app main.py scripts -x tests
      - run: pip-audit -r requirements.txt
      - run: docker build -t trainingbuddy:${{ github.sha }} .

