<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Kemet FC</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/design-system.css">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: #15304d;
      background: #f4f7fb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, #2c7be522, transparent 38%),
        radial-gradient(circle at bottom right, #1aa98122, transparent 35%),
        #f4f7fb;
    }
    main {
      width: min(100%, 430px);
      padding: 34px;
      border: 1px solid #dce5ef;
      border-radius: 20px;
      background: white;
      box-shadow: 0 24px 60px #15304d18;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .brand img { width: 80px; height: 80px; object-fit: contain; }
    .brand span { color: #1aa981; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { color: #66788a; line-height: 1.5; }
    form { display: grid; gap: 18px; margin-top: 24px; }
    label { display: grid; gap: 7px; font-weight: 750; font-size: 14px; }
    input {
      width: 100%;
      border: 1px solid #cbd8e5;
      border-radius: 10px;
      padding: 12px 13px;
      font: inherit;
      color: #15304d;
    }
    input:focus {
      outline: 3px solid #2c7be522;
      border-color: #2c7be5;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 13px;
      background: #15304d;
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: 0.65; cursor: wait; }
    .status { min-height: 22px; margin: 0; }
    .status.error { color: #b42318; }
    .status.success { color: #13844b; }
    [hidden] { display: none !important; }
    .step-note {
      margin: 0 0 4px; padding: 12px 14px; border-radius: 10px;
      background: #f4f7fb !important; color: #45566b !important;
      font-size: 13px; line-height: 1.5;
    }
    .resend {
      background: none !important; border: 0; padding: 0; width: auto;
      color: #2c7be5 !important; font-weight: 700; font-size: 13px;
      text-decoration: underline; cursor: pointer; margin-top: -6px;
      box-shadow: none !important;
    }
    .resend:hover { transform: none !important; }
    .back-link {
      display: block; margin-top: 18px; text-align: center;
      color: #66788a; font-size: 13px; text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }

    /* design-system.css forces a dark theme site-wide (body background +
       heading/label/paragraph colors) with !important. login.html has a
       matching dark-card override baked into design-system.css itself
       (body:has(#login-form) ...); this page needs the same treatment
       so its headings/labels aren't near-white text on a white card. */
    body:has(#request-form) {
      background:
        radial-gradient(circle at 16% 12%, rgba(245, 196, 93, .1), transparent 30%),
        radial-gradient(circle at 90% 88%, rgba(37, 99, 235, .08), transparent 34%),
        #071A2B !important;
    }
    body:has(#request-form) > main {
      border: 1px solid rgba(245, 196, 93, .18) !important;
      background: rgba(13, 42, 69, .96) !important;
      box-shadow: 0 35px 90px rgba(0, 0, 0, .5) !important;
      color: #F4F7FA !important;
    }
    body:has(#request-form) h1 { color: #F4F7FA !important; }
    body:has(#request-form) .brand { color: #F4F7FA !important; }
    body:has(#request-form) .brand span { color: #16A66A !important; }
    body:has(#request-form) label { color: #8CA1BB !important; }
    body:has(#request-form) .back-link { color: #8CA1BB !important; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/logo.png" alt=""> Kemet <span>FC</span></div>

    <div id="step-request">
      <h1>Reset your password</h1>
      <p>Enter your username and we'll email a 6-digit code to the address on your account.</p>
      <form id="request-form">
        <label for="username">
          Username
          <input id="username" autocomplete="username" required autofocus>
        </label>
        <p id="request-status" class="status" role="status"></p>
        <button id="request-button" type="submit">Send code</button>
      </form>
    </div>

    <div id="step-confirm" hidden>
      <h1>Enter your code</h1>
      <p class="step-note">
        If an account exists for <strong id="confirm-username-label"></strong>
        with an email on file, a 6-digit code was sent to it. The code
        expires in 15 minutes.
      </p>
      <form id="confirm-form">
        <label for="code">
          6-digit code
          <input id="code" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" required>
        </label>
        <label for="new-password">
          New password
          <input id="new-password" type="password" autocomplete="new-password" minlength="12" required>
        </label>
        <label for="confirm-password">
          Confirm new password
          <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
        </label>
        <p id="confirm-status" class="status" role="status"></p>
        <button id="confirm-button" type="submit">Reset password</button>
        <button type="button" class="resend" id="resend-button">Resend code</button>
      </form>
    </div>

    <a class="back-link" href="/login">← Back to sign in</a>
  </main>

  <script>
    const stepRequest = document.querySelector("#step-request");
    const stepConfirm = document.querySelector("#step-confirm");
    const requestForm = document.querySelector("#request-form");
    const requestStatus = document.querySelector("#request-status");
    const requestButton = document.querySelector("#request-button");
    const confirmForm = document.querySelector("#confirm-form");
    const confirmStatus = document.querySelector("#confirm-status");
    const confirmButton = document.querySelector("#confirm-button");
    const resendButton = document.querySelector("#resend-button");
    const confirmUsernameLabel = document.querySelector("#confirm-username-label");

    let currentUsername = "";

    async function requestCode(username) {
      const response = await fetch("/auth/password-reset/request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username }),
      });
      const result = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(result.detail || "Could not send the reset code.");
      }

      return result;
    }

    requestForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      requestStatus.className = "status";
      requestStatus.textContent = "Sending code...";
      requestButton.disabled = true;

      currentUsername = document.querySelector("#username").value.trim();

      try {
        await requestCode(currentUsername);
        confirmUsernameLabel.textContent = currentUsername;
        stepRequest.hidden = true;
        stepConfirm.hidden = false;
        document.querySelector("#code").focus();
      } catch (error) {
        requestStatus.className = "status error";
        requestStatus.textContent = error.message;
      } finally {
        requestButton.disabled = false;
      }
    });

    resendButton.addEventListener("click", async () => {
      resendButton.disabled = true;
      confirmStatus.className = "status";
      confirmStatus.textContent = "Sending a new code...";

      try {
        await requestCode(currentUsername);
        confirmStatus.className = "status success";
        confirmStatus.textContent = "A new code was sent.";
      } catch (error) {
        confirmStatus.className = "status error";
        confirmStatus.textContent = error.message;
      } finally {
        resendButton.disabled = false;
      }
    });

    confirmForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      confirmStatus.className = "status";

      const newPassword = document.querySelector("#new-password").value;
      const confirmPassword = document.querySelector("#confirm-password").value;

      if (newPassword !== confirmPassword) {
        confirmStatus.className = "status error";
        confirmStatus.textContent = "Passwords do not match.";
        return;
      }

      confirmButton.disabled = true;
      confirmStatus.textContent = "Resetting password...";

      try {
        const response = await fetch("/auth/password-reset/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: currentUsername,
            code: document.querySelector("#code").value.trim(),
            new_password: newPassword,
          }),
        });
        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.detail || "Could not reset the password.");
        }

        confirmStatus.className = "status success";
        confirmStatus.textContent = "Password updated. Redirecting to sign in...";
        setTimeout(() => location.assign("/login"), 1200);
      } catch (error) {
        confirmStatus.className = "status error";
        confirmStatus.textContent = error.message;
        confirmButton.disabled = false;
      }
    });
  </script>
</body>
</html>
