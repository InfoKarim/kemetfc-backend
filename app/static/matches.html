<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matches | Kemet FC</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/design-system.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #142039; background: #f5f7fb; }
    .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
    aside { padding: 26px 16px; color: white; background: #071b35; }
    .brand { margin: 0 10px 30px; color: #ffd36b; font-size: 22px; font-weight: 800; }
    nav { display: grid; gap: 8px; }
    nav a { padding: 12px 14px; border-radius: 9px; color: #dbe7f7; text-decoration: none; }
    nav a:hover, nav a.active { color: white; background: #1265ed; }
    main { padding: 30px; }
    h1, h2, h3, p { margin-top: 0; }
    .muted { color: #69768a; }
    .topbar { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .primary { padding: 12px 18px; border-radius: 9px; color: white; background: #1265ed; font-weight: 750; text-decoration: none; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
    .stat, .panel { padding: 20px; border: 1px solid #e1e7ef; border-radius: 15px; background: white; }
    .stat strong { display: block; margin-top: 8px; font-size: 29px; }
    .toolbar { display: grid; grid-template-columns: 1fr 210px; gap: 12px; margin-bottom: 18px; }
    input, select { width: 100%; padding: 12px 14px; border: 1px solid #d8e0eb; border-radius: 9px; background: white; font: inherit; }
    #matches-list { display: grid; gap: 12px; }
    .match { display: grid; grid-template-columns: 145px 1fr 120px 110px; gap: 18px; align-items: center; padding: 17px; border: 1px solid #e1e7ef; border-radius: 13px; background: #fbfcfe; }
    .date strong, .date span { display: block; }
    .date span { margin-top: 4px; color: #69768a; font-size: 12px; }
    .teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; font-weight: 750; }
    .teams span:last-child { text-align: right; }
    .score { font-size: 22px; font-weight: 850; white-space: nowrap; }
    .badge { display: inline-block; width: fit-content; padding: 6px 9px; border-radius: 999px; color: #075f91; background: #dff2ff; font-size: 12px; font-weight: 800; text-transform: capitalize; }
    .completed { color: #087441; background: #daf4e5; }
    .cancelled { color: #a22d2d; background: #ffebeb; }
    .delete { padding: 7px 10px; border: 0; border-radius: 7px; color: #b83232; background: #fff0f0; cursor: pointer; }
    .state { padding: 40px; color: #69768a; text-align: center; border-radius: 12px; background: white; }
    @media (max-width: 850px) {
      .match { grid-template-columns: 1fr 1fr; }
      .teams { grid-column: 1 / -1; }
    }
    .mobile-nav { display: none; }
    @media (max-width: 650px) {
      .layout { grid-template-columns: 1fr; }
      aside { display: none; }
      main { padding: 18px 18px 94px; }
      .topbar { flex-direction: column; }
      .stats, .toolbar { grid-template-columns: 1fr; }
      .match { grid-template-columns: 1fr; }
      .teams { grid-column: auto; }
      .mobile-nav {
        position: fixed; z-index: 20; right: 10px; bottom: 10px; left: 10px;
        display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px;
        border: 1px solid rgba(255, 255, 255, .10); border-radius: 18px;
        background: rgba(7, 26, 43, .96); box-shadow: 0 18px 42px rgba(0, 0, 0, .24);
        backdrop-filter: blur(16px);
      }
      .mobile-nav a {
        padding: 9px 4px; border-radius: 11px; color: #b7c4cf; text-align: center;
        text-decoration: none; font-size: 11px; font-weight: 800;
      }
      .mobile-nav a.active { color: #b7f15a; background: rgba(124, 219, 32, .10); }
    }
  </style>
  <script src="/auth-client.js"></script>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand">Kemet FC</div>
      <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/players-dashboard">Players</a>
        <a href="/teams-dashboard">Teams</a>
        <a href="/assessments-dashboard">Assessments</a>
        <a href="/training-plans-dashboard">Training Plans</a>
        <a href="/drill-library">Drill Library</a>
        <a href="/videos-dashboard">Videos</a>
        <a class="active" href="/matches-dashboard">Matches</a>
        <a href="/reports-dashboard">Reports</a>
        <a href="/calendar-dashboard">Calendar</a>
              <a href="/registrations-dashboard">Assessment Registrations</a>
              <a href="/messages-page">Messaging <span class="nav-badge" id="messaging-badge" hidden></span></a>
      </nav>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1>Matches</h1>
          <p class="muted">Manage fixtures, results, and player match activity.</p>
        </div>
        <a id="add-match" class="primary" href="/add-match">+ Add Match</a>
      </header>

      <section class="stats">
        <article class="stat"><span class="muted">Total matches</span><strong id="total-matches">0</strong></article>
        <article class="stat"><span class="muted">Upcoming</span><strong id="upcoming-matches">0</strong></article>
        <article class="stat"><span class="muted">Completed</span><strong id="completed-matches">0</strong></article>
      </section>

      <section class="panel">
        <div class="toolbar">
          <input id="match-search" type="search" placeholder="Search teams, competition, or match ID">
          <select id="status-filter">
            <option value="">All statuses</option>
            <option value="scheduled">Scheduled</option>
            <option value="in_progress">In progress</option>
            <option value="completed">Completed</option>
            <option value="postponed">Postponed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div id="matches-list">
          <div class="state">Loading matches...</div>
        </div>
      </section>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="/dashboard">Home</a>
    <a href="/players-dashboard">Players</a>
    <a href="/drill-library">Train</a>
    <a class="active" href="/matches-dashboard">Matches</a>
  </nav>

  <script>
    const list = document.querySelector("#matches-list");
    const search = document.querySelector("#match-search");
    const statusFilter = document.querySelector("#status-filter");
    let matches = [];
    let teams = [];

    function teamName(teamId) {
      const team = teams.find((item) => item.team_id === teamId);
      return team ? team.name : teamId;
    }

    const make = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };

    function updateStats() {
      document.querySelector("#total-matches").textContent = matches.length;
      document.querySelector("#upcoming-matches").textContent =
        matches.filter((match) => match.status === "scheduled").length;
      document.querySelector("#completed-matches").textContent =
        matches.filter((match) => match.status === "completed").length;
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const status = statusFilter.value;

      const visible = matches.filter((match) =>
        `${match.match_id} ${match.competition_id} ${match.home_team_id} ${match.away_team_id}`
          .toLowerCase()
          .includes(query) &&
        (!status || match.status === status)
      );

      list.replaceChildren();

      if (!visible.length) {
        list.append(make("div", "state", "No matches found."));
        return;
      }

      visible
        .slice()
        .sort((a, b) => new Date(b.match_date) - new Date(a.match_date))
        .forEach((match) => {
          const row = make("article", "match");
          const date = new Date(match.match_date);

          const dateBox = make("div", "date");
          dateBox.append(make("strong", "", date.toLocaleDateString()));
          dateBox.append(make(
            "span",
            "",
            date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          ));

          const teams = make("div", "teams");
          teams.append(make("span", "", teamName(match.home_team_id)));
          teams.append(make("span", "muted", "vs"));
          teams.append(make("span", "", teamName(match.away_team_id)));

          const score = match.home_score === null
            ? "—"
            : `${match.home_score} - ${match.away_score}`;

          const result = make("div", "score", score);

          const controls = make("div");
          controls.append(make(
            "span",
            `badge ${match.status}`,
            match.status.replace("_", " ")
          ));

          const remove = make("button", "delete", "Delete");
          remove.type = "button";
          remove.addEventListener("click", () => deleteMatch(match.match_id));
          controls.append(document.createElement("br"), remove);

          row.append(dateBox, teams, result, controls);
          list.append(row);
        });
    }

    async function deleteMatch(matchId) {
      if (!confirm(`Delete ${matchId}?`)) return;

      const response = await fetch(
        `/matches/${encodeURIComponent(matchId)}`,
        { method: "DELETE" }
      );

      if (response.ok) {
        matches = matches.filter((match) => match.match_id !== matchId);
        updateStats();
        render();
      }
    }

    async function loadMatches() {
      try {
        const [matchesResponse, teamsResponse] = await Promise.all([
          fetch("/matches"),
          fetch("/teams"),
        ]);
        if (!matchesResponse.ok || !teamsResponse.ok) {
          throw new Error();
        }
        [matches, teams] = await Promise.all([
          matchesResponse.json(),
          teamsResponse.json(),
        ]);
        updateStats();
        render();
      } catch {
        list.replaceChildren(make("div", "state", "Could not load matches."));
      }
    }

    search.addEventListener("input", render);
    statusFilter.addEventListener("change", render);
    loadMatches();
  </script>
</body>
</html>
