<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar | Kemet FC</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/design-system.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #142039; background: #f5f7fb; }
    .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
    aside { padding: 26px 16px; color: white; background: #071b35; }
    .brand { margin: 0 10px 30px; color: #ffd36b; font-size: 22px; font-weight: 800; }
    nav { display: grid; gap: 8px; }
    nav a { padding: 12px 14px; border-radius: 9px; color: #dbe7f7; text-decoration: none; }
    nav a:hover, nav a.active { color: white; background: #1265ed; }
    main { padding: 30px; }
    h1, h2, h3, p { margin-top: 0; }
    .muted { color: #69768a; }
    .topbar { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .calendar-layout { display: grid; grid-template-columns: 1fr 300px; gap: 18px; }
    .card { padding: 20px; border: 1px solid #e1e7ef; border-radius: 15px; background: white; }
    .calendar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .calendar-head h2 { margin: 0; }
    .calendar-head button { width: 38px; height: 38px; border: 1px solid #d8e0eb; border-radius: 9px; background: white; cursor: pointer; }
    .weekdays, #calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .weekdays span { padding: 8px; color: #69768a; text-align: center; font-size: 12px; font-weight: 800; }
    .day { min-height: 105px; padding: 8px; border-top: 1px solid #e8edf3; border-left: 1px solid #e8edf3; background: white; }
    .day:nth-child(7n) { border-right: 1px solid #e8edf3; }
    .day.other { color: #a8b0bd; background: #fafbfd; }
    .day.today .number { display: grid; width: 27px; height: 27px; place-items: center; border-radius: 50%; color: white; background: #1265ed; }
    .number { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 800; }
    .event { display: block; margin-bottom: 4px; padding: 4px 6px; overflow: hidden; border-radius: 5px; color: #075f91; background: #dff2ff; font-size: 10px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .event.plan { color: #6b3cbc; background: #f0e8ff; }
    #calendar-events { display: grid; gap: 10px; }
    .event-card { padding: 13px; border-left: 4px solid #1265ed; border-radius: 9px; background: #f8fafc; }
    .event-card.plan { border-color: #7b4ee4; }
    .event-card p { margin-bottom: 0; }
    .state { padding: 25px; color: #69768a; text-align: center; }
    @media (max-width: 950px) {
      .calendar-layout { grid-template-columns: 1fr; }
    }
    .mobile-nav { display: none; }
    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
      aside { display: none; }
      main { padding: 18px 18px 94px; }
      .day { min-height: 75px; padding: 5px; }
      .event { font-size: 0; height: 7px; padding: 0; }
      .mobile-nav {
        position: fixed; z-index: 20; right: 10px; bottom: 10px; left: 10px;
        display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px;
        border: 1px solid rgba(255, 255, 255, .10); border-radius: 18px;
        background: rgba(7, 26, 43, .96); box-shadow: 0 18px 42px rgba(0, 0, 0, .24);
        backdrop-filter: blur(16px);
      }
      .mobile-nav a {
        padding: 9px 4px; border-radius: 11px; color: #b7c4cf; text-align: center;
        text-decoration: none; font-size: 11px; font-weight: 800;
      }
      .mobile-nav a.active { color: #b7f15a; background: rgba(124, 219, 32, .10); }
    }
  </style>
  <script src="/auth-client.js"></script>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand">Kemet FC</div>
      <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/players-dashboard">Players</a>
        <a href="/teams-dashboard">Teams</a>
        <a href="/assessments-dashboard">Assessments</a>
        <a href="/training-plans-dashboard">Training Plans</a>
        <a href="/drill-library">Drill Library</a>
        <a href="/videos-dashboard">Videos</a>
        <a href="/matches-dashboard">Matches</a>
        <a href="/reports-dashboard">Reports</a>
        <a class="active" href="/calendar-dashboard">Calendar</a>
              <a href="/registrations-dashboard">Assessment Registrations</a>
              <a href="/messages-page">Messaging <span class="nav-badge" id="messaging-badge" hidden></span></a>
      </nav>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1>Calendar</h1>
          <p class="muted">Matches and training plan activity in one place.</p>
        </div>
      </header>

      <div class="calendar-layout">
        <section class="card">
          <div class="calendar-head">
            <button id="previous-month" type="button" aria-label="Previous month">←</button>
            <h2 id="calendar-title"></h2>
            <button id="next-month" type="button" aria-label="Next month">→</button>
          </div>

          <div class="weekdays">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
            <span>Thu</span><span>Fri</span><span>Sat</span>
          </div>

          <div id="calendar-grid"></div>
        </section>

        <section class="card">
          <h2>Events This Month</h2>
          <div id="calendar-events">
            <div class="state">Loading events...</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="/dashboard">Home</a>
    <a href="/players-dashboard">Players</a>
    <a href="/drill-library">Train</a>
    <a class="active" href="/calendar-dashboard">Calendar</a>
  </nav>

  <script>
    const title = document.querySelector("#calendar-title");
    const grid = document.querySelector("#calendar-grid");
    const eventList = document.querySelector("#calendar-events");
    let viewDate = new Date();
    let events = [];

    const sameDay = (left, right) =>
      left.getFullYear() === right.getFullYear() &&
      left.getMonth() === right.getMonth() &&
      left.getDate() === right.getDate();

    const make = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };

    function renderCalendar() {
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      const first = new Date(year, month, 1);
      const start = new Date(year, month, 1 - first.getDay());
      const today = new Date();

      title.textContent = viewDate.toLocaleDateString([], {
        month: "long",
        year: "numeric"
      });

      grid.replaceChildren();

      for (let index = 0; index < 42; index += 1) {
        const date = new Date(start);
        date.setDate(start.getDate() + index);

        const day = make(
          "div",
          `day ${date.getMonth() !== month ? "other" : ""} ${
            sameDay(date, today) ? "today" : ""
          }`
        );

        day.append(make("span", "number", date.getDate()));

        events
          .filter((event) => sameDay(new Date(event.date), date))
          .slice(0, 3)
          .forEach((event) => {
            day.append(make(
              "span",
              `event ${event.type}`,
              event.title
            ));
          });

        grid.append(day);
      }

      renderEventList();
    }

    function renderEventList() {
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();

      const monthEvents = events
        .filter((event) => {
          const date = new Date(event.date);
          return date.getFullYear() === year && date.getMonth() === month;
        })
        .sort((a, b) => new Date(a.date) - new Date(b.date));

      eventList.replaceChildren();

      if (!monthEvents.length) {
        eventList.append(make("div", "state", "No events this month."));
        return;
      }

      monthEvents.forEach((event) => {
        const card = make("article", `event-card ${event.type}`);
        card.append(make("strong", "", event.title));
        card.append(make(
          "p",
          "muted",
          new Date(event.date).toLocaleString()
        ));
        eventList.append(card);
      });
    }

    async function loadEvents() {
      try {
        const [matchResponse, planResponse] = await Promise.all([
          fetch("/matches"),
          fetch("/training-plans")
        ]);

        if (!matchResponse.ok || !planResponse.ok) throw new Error();

        const matches = await matchResponse.json();
        const plans = await planResponse.json();

        events = [
          ...matches.map((match) => ({
            type: "match",
            title: `${match.home_team_id} vs ${match.away_team_id}`,
            date: match.match_date
          })),
          ...plans.map((plan) => ({
            type: "plan",
            title: `Plan ${plan.plan_id}`,
            date: plan.created_at
          }))
        ];

        renderCalendar();
      } catch {
        eventList.replaceChildren(make("div", "state", "Could not load events."));
      }
    }

    document.querySelector("#previous-month").addEventListener("click", () => {
      viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
      renderCalendar();
    });

    document.querySelector("#next-month").addEventListener("click", () => {
      viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
      renderCalendar();
    });

    renderCalendar();
    loadEvents();
  </script>
</body>
</html>
