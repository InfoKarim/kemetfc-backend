<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports | Kemet FC</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/design-system.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #142039; background: #f5f7fb; }
    .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
    aside { padding: 26px 16px; color: white; background: #071b35; }
    .brand { margin: 0 10px 30px; color: #ffd36b; font-size: 22px; font-weight: 800; }
    nav { display: grid; gap: 8px; }
    nav a { padding: 12px 14px; border-radius: 9px; color: #dbe7f7; text-decoration: none; }
    nav a:hover, nav a.active { color: white; background: #1265ed; }
    main { padding: 30px; }
    h1, h2, h3, p { margin-top: 0; }
    .muted { color: #69768a; }
    .topbar { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    button { padding: 12px 18px; border: 0; border-radius: 9px; color: white; background: #1265ed; font: inherit; font-weight: 750; cursor: pointer; }
    button:disabled { opacity: .5; }
    .controls, .card { padding: 20px; border: 1px solid #e1e7ef; border-radius: 15px; background: white; }
    .controls { display: grid; grid-template-columns: 1fr 220px; gap: 14px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 750; }
    select { width: 100%; padding: 12px 14px; border: 1px solid #d8e0eb; border-radius: 9px; background: white; font: inherit; }
    #report-content { display: grid; gap: 18px; }
    .profile { display: grid; grid-template-columns: 1.3fr repeat(3, 1fr); gap: 14px; }
    .identity { display: flex; align-items: center; gap: 14px; }
    .avatar { display: grid; width: 64px; height: 64px; place-items: center; border-radius: 50%; color: white; background: #1265ed; font-size: 21px; font-weight: 850; }
    .metric { padding: 15px; border-radius: 11px; background: #f7f9fc; }
    .metric strong { display: block; margin-top: 7px; font-size: 24px; }
    .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .list { display: grid; gap: 10px; }
    .item { padding: 13px; border-radius: 10px; background: #f8fafc; }
    .item-head { display: flex; justify-content: space-between; gap: 12px; }
    .bar { height: 7px; margin-top: 9px; overflow: hidden; border-radius: 10px; background: #e5eaf1; }
    .bar span { display: block; height: 100%; background: #f39320; }
    .plan { border-left: 4px solid #1265ed; }
    .state { padding: 42px; color: #69768a; text-align: center; border-radius: 12px; background: white; }
    @media (max-width: 900px) {
      .profile { grid-template-columns: 1fr 1fr; }
      .two-column { grid-template-columns: 1fr; }
    }
    .mobile-nav { display: none; }
    @media (max-width: 650px) {
      .layout { grid-template-columns: 1fr; }
      aside { display: none; }
      main { padding: 18px 18px 94px; }
      .topbar { flex-direction: column; }
      .controls, .profile { grid-template-columns: 1fr; }
      .mobile-nav {
        position: fixed; z-index: 20; right: 10px; bottom: 10px; left: 10px;
        display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px;
        border: 1px solid rgba(255, 255, 255, .10); border-radius: 18px;
        background: rgba(7, 26, 43, .96); box-shadow: 0 18px 42px rgba(0, 0, 0, .24);
        backdrop-filter: blur(16px);
      }
      .mobile-nav a {
        padding: 9px 4px; border-radius: 11px; color: #b7c4cf; text-align: center;
        text-decoration: none; font-size: 11px; font-weight: 800;
      }
      .mobile-nav a.active { color: #b7f15a; background: rgba(124, 219, 32, .10); }
    }
    @media print {
      aside, .topbar button, .controls, .mobile-nav { display: none !important; }
      .layout { display: block; }
      main { padding: 0; }
      body { background: white; }
      .card { break-inside: avoid; box-shadow: none; }
    }
  </style>
  <script src="/auth-client.js"></script>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand">Kemet FC</div>
      <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/players-dashboard">Players</a>
        <a href="/teams-dashboard">Teams</a>
        <a href="/assessments-dashboard">Assessments</a>
        <a href="/training-plans-dashboard">Training Plans</a>
        <a href="/drill-library">Drill Library</a>
        <a href="/videos-dashboard">Videos</a>
        <a href="/matches-dashboard">Matches</a>
        <a class="active" href="/reports-dashboard">Reports</a>
        <a href="/calendar-dashboard">Calendar</a>
              <a href="/registrations-dashboard">Assessment Registrations</a>
              <a href="/messages-page">Messaging <span class="nav-badge" id="messaging-badge" hidden></span></a>
      </nav>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1>Reports</h1>
          <p class="muted">Player development, assessment, and training summaries.</p>
        </div>
        <button id="print-report" type="button" disabled>Print Report</button>
      </header>

      <section class="controls">
        <div>
          <label for="report-player">Player</label>
          <select id="report-player">
            <option value="">Loading players...</option>
          </select>
        </div>

        <div>
          <label for="report-period">Report period</label>
          <select id="report-period">
            <option value="all">All time</option>
            <option value="90">Last 90 days</option>
            <option value="30">Last 30 days</option>
          </select>
        </div>
      </section>

      <section id="report-content">
        <div class="state">Select a player to generate a report.</div>
      </section>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="/dashboard">Home</a>
    <a href="/players-dashboard">Players</a>
    <a href="/drill-library">Train</a>
    <a class="active" href="/reports-dashboard">Reports</a>
  </nav>

  <script>
    const playerSelect = document.querySelector("#report-player");
    const periodSelect = document.querySelector("#report-period");
    const reportContent = document.querySelector("#report-content");
    const printButton = document.querySelector("#print-report");

    let players = [];
    let analyses = [];
    let plans = [];

    const make = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };

    const normalize = (item) => Array.isArray(item)
      ? { attribute: item[0], score: item[1] }
      : { attribute: item.attribute, score: item.score };

    function filteredAnalyses(playerId) {
      const days = periodSelect.value;
      const cutoff = days === "all"
        ? null
        : Date.now() - Number(days) * 24 * 60 * 60 * 1000;

      return analyses.filter((analysis) =>
        analysis.player_id === playerId &&
        (!cutoff || new Date(analysis.created_at).getTime() >= cutoff)
      );
    }

    function renderReport() {
      const playerId = playerSelect.value;
      const player = players.find((item) => item.player_id === playerId);

      reportContent.replaceChildren();

      if (!player) {
        reportContent.append(make("div", "state", "Select a player to generate a report."));
        printButton.disabled = true;
        return;
      }

      const playerAnalyses = filteredAnalyses(playerId);
      const playerPlans = plans.filter((plan) => plan.player_id === playerId);
      const scores = playerAnalyses
        .map((analysis) => analysis.overall_score)
        .filter((score) => typeof score === "number");
      const average = scores.length
        ? scores.reduce((sum, score) => sum + score, 0) / scores.length
        : null;

      const profile = make("section", "card profile");
      const identity = make("div", "identity");
      identity.append(make(
        "div",
        "avatar",
        `${player.first_name_en[0]}${player.last_name_en[0]}`.toUpperCase()
      ));

      const name = make("div");
      name.append(make("h2", "", `${player.first_name_en} ${player.last_name_en}`));
      name.append(make("p", "muted", player.player_id));
      identity.append(name);
      profile.append(identity);

      [
        ["Assessments", playerAnalyses.length],
        ["Average score", average === null ? "—" : average.toFixed(1)],
        ["Training plans", playerPlans.length]
      ].forEach(([label, value]) => {
        const metric = make("div", "metric");
        metric.append(make("span", "muted", label), make("strong", "", value));
        profile.append(metric);
      });

      const columns = make("div", "two-column");
      const assessmentCard = make("section", "card");
      assessmentCard.append(make("h2", "", "Development Areas"));
      const weaknessList = make("div", "list");

      const weaknesses = playerAnalyses
        .flatMap((analysis) => analysis.weaknesses || [])
        .map(normalize)
        .sort((a, b) => a.score - b.score)
        .slice(0, 6);

      if (!weaknesses.length) {
        weaknessList.append(make("div", "state", "No assessment data."));
      } else {
        weaknesses.forEach((weakness) => {
          const item = make("div", "item");
          const head = make("div", "item-head");
          head.append(make("strong", "", weakness.attribute));
          head.append(make("strong", "", weakness.score));
          const bar = make("div", "bar");
          const fill = make("span");
          fill.style.width = `${weakness.score}%`;
          bar.append(fill);
          item.append(head, bar);
          weaknessList.append(item);
        });
      }

      assessmentCard.append(weaknessList);

      const planCard = make("section", "card");
      planCard.append(make("h2", "", "Training Plans"));
      const planList = make("div", "list");

      if (!playerPlans.length) {
        planList.append(make("div", "state", "No training plans."));
      } else {
        playerPlans.forEach((plan) => {
          const item = make("div", "item plan");
          const head = make("div", "item-head");
          head.append(make("strong", "", plan.plan_id));
          head.append(make("strong", "", plan.status));
          item.append(head);
          item.append(make(
            "p",
            "muted",
            `${plan.player_difficulty} · ${plan.target_duration} minutes`
          ));
          planList.append(item);
        });
      }

      planCard.append(planList);
      columns.append(assessmentCard, planCard);
      reportContent.append(profile, columns);
      printButton.disabled = false;
    }

    async function loadData() {
      try {
        const responses = await Promise.all([
          fetch("/players"),
          fetch("/analyses"),
          fetch("/training-plans")
        ]);

        if (responses.some((response) => !response.ok)) throw new Error();

        [players, analyses, plans] = await Promise.all(
          responses.map((response) => response.json())
        );

        playerSelect.replaceChildren(new Option("Select player", ""));
        players.forEach((player) => {
          playerSelect.append(new Option(
            `${player.first_name_en} ${player.last_name_en}`,
            player.player_id
          ));
        });
      } catch {
        reportContent.replaceChildren(make("div", "state", "Could not load report data."));
      }
    }

    playerSelect.addEventListener("change", renderReport);
    periodSelect.addEventListener("change", renderReport);
    printButton.addEventListener("click", () => window.print());
    loadData();
  </script>
</body>
</html>
