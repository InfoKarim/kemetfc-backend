<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Team | Kemet FC</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/design-system.css">
  <style>
    :root {
      --navy: #061a33;
      --blue: #1268e8;
      --ink: #14213a;
      --muted: #68758a;
      --line: #dfe6ef;
      --surface: #f5f8fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--surface);
      font: 15px/1.5 Inter, system-ui, sans-serif;
    }

    .layout {
      display: grid;
      min-height: 100vh;
      grid-template-columns: 240px 1fr;
    }

    aside {
      padding: 28px 18px;
      color: white;
      background: var(--navy);
    }

    .brand {
      margin: 0 10px 30px;
      color: #f2c35b;
      font-size: 22px;
      font-weight: 800;
    }

    nav { display: grid; gap: 8px; }

    nav a {
      padding: 12px 14px;
      color: #dbe7f5;
      border-radius: 9px;
      text-decoration: none;
    }

    nav a:hover,
    nav a.active {
      color: white;
      background: var(--blue);
    }

    main {
      width: min(820px, calc(100% - 36px));
      margin: 0 auto;
      padding: 34px 0;
    }

    header { margin-bottom: 22px; }
    h1 { margin: 0; font-size: 30px; }
    header p { color: var(--muted); }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      padding: 26px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      font: inherit;
    }

    .full { grid-column: 1 / -1; }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 5px;
    }

    button,
    .cancel {
      padding: 11px 18px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button {
      color: white;
      background: var(--blue);
    }

    .cancel {
      color: var(--ink);
      background: #edf1f6;
      text-decoration: none;
    }

    #form-status { margin: 0; color: var(--muted); }

    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      aside { display: none; }
      form { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
    }
  </style>
  <script src="/auth-client.js"></script>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand">Kemet FC</div>
      <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/players-dashboard">Players</a>
        <a class="active" href="/teams-dashboard">Teams</a>
        <a href="/assessments-dashboard">Assessments</a>
        <a href="/training-plans-dashboard">Training Plans</a>
        <a href="/drill-library">Drill Library</a>
        <a href="/videos-dashboard">Videos</a>
        <a href="/matches-dashboard">Matches</a>
        <a href="/reports-dashboard">Reports</a>
        <a href="/calendar-dashboard">Calendar</a>
              <a href="/registrations-dashboard">Assessment Registrations</a>
              <a href="/messages-page">Messaging <span class="nav-badge" id="messaging-badge" hidden></span></a>
      </nav>
    </aside>

    <main>
      <header>
        <h1>Add Team</h1>
        <p>Create a new academy team and assign its coach and season.</p>
      </header>

      <form id="team-form">
        <div>
          <label for="team-name">Team name</label>
          <input
            id="team-name"
            name="name"
            placeholder="Kemet FC U10"
            required
          >
        </div>

        <div>
          <label for="age-group">Age group</label>
          <input
            id="age-group"
            name="age_group"
            placeholder="U10"
            pattern="[Uu][0-9]+"
            required
          >
        </div>

        <div>
          <label for="coach-name">Coach</label>
          <input
            id="coach-name"
            name="coach_name"
            placeholder="Coach Ahmed"
            required
          >
        </div>

        <div>
          <label for="season-id">Season</label>
          <input
            id="season-id"
            name="season_id"
            placeholder="2026-2027"
            required
          >
        </div>

        <div>
          <label for="active">Status</label>
          <select id="active" name="active">
            <option value="true">Active</option>
            <option value="false">Inactive</option>
          </select>
        </div>

        <p id="form-status" class="full" role="status"></p>

        <div class="actions full">
          <a class="cancel" href="/teams-dashboard">Cancel</a>
          <button type="submit">Create team</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const form = document.querySelector("#team-form");
    const status = document.querySelector("#form-status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Creating team...";

      const data = new FormData(form);
      const payload = {
        name: data.get("name").trim(),
        age_group: data.get("age_group").trim(),
        coach_name: data.get("coach_name").trim(),
        season_id: data.get("season_id").trim(),
        active: data.get("active") === "true",
      };

      try {
        const response = await fetch("/teams", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.detail || "Could not create team");
        }

        window.location.href = "/teams-dashboard";
      } catch (error) {
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>
