<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training Plan Details | Kemet FC</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/design-system.css">
  <style>
    :root {
      --navy: #061a33;
      --blue: #0866f5;
      --green: #17a957;
      --line: #dfe6ef;
      --muted: #66758b;
      --page: #f4f7fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #10213b;
      background: var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    .layout {
      display: grid;
      min-height: 100vh;
      grid-template-columns: 240px 1fr;
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 28px 16px;
      color: white;
      background: linear-gradient(180deg, #071d39, #031226);
    }

    .brand {
      margin: 0 10px 34px;
      color: #f5c45d;
      font-size: 24px;
      font-weight: 900;
    }

    .brand small {
      display: block;
      margin-top: 3px;
      color: #8ca1bb;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    nav { display: grid; gap: 7px; }

    nav a {
      padding: 12px 14px;
      border-radius: 9px;
      color: #dce7f5;
      text-decoration: none;
      font-size: 14px;
      font-weight: 650;
    }

    nav a:hover,
    nav a.active {
      color: white;
      background: var(--blue);
    }

    main {
      min-width: 0;
      padding: 28px 32px 56px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -.035em;
    }

    header p {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .back {
      color: var(--blue);
      text-decoration: none;
      font-weight: 750;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 190px;
      gap: 20px;
      margin-bottom: 20px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
    }

    .summary h2 { margin: 0 0 7px; color: #16233B !important; }

    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta span {
      padding: 7px 10px;
      border: none !important;
      border-radius: 8px;
      color: #405269 !important;
      background: #eef3f8 !important;
      font-size: 12px;
      font-weight: 700;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #d7e0eb;
      border-radius: 9px;
      background: white;
      font: inherit;
    }

    .plan-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }

    .edit-plan-btn, .delete-plan-btn {
      padding: 9px 12px !important;
      border-radius: 9px !important;
      font: inherit;
      font-weight: 750 !important;
      cursor: pointer;
      text-align: center;
    }

    .edit-plan-btn {
      border: 1px solid #d7e0eb !important;
      background: #eef3f8 !important;
      color: #16233B !important;
    }
    .edit-plan-btn:hover { background: #e3ebf3 !important; }

    .delete-plan-btn {
      border: 1px solid #f3c9c9 !important;
      background: #fff5f5 !important;
      color: #b83232 !important;
    }
    .delete-plan-btn:hover { background: #ffe9e9 !important; }
    .delete-plan-btn:disabled { opacity: .6; cursor: wait; }

    .edit-plan-form {
      display: grid;
      gap: 10px;
      margin-bottom: 20px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
    }
    .edit-plan-form input {
      width: 100%;
      padding: 11px;
      border: 1px solid #d7e0eb;
      border-radius: 9px;
      background: white;
      font: inherit;
      color: #16233B !important;
    }
    .edit-plan-actions { display: flex; gap: 10px; margin-top: 6px; }
    .save-plan-btn {
      padding: 10px 16px !important;
      border: 0 !important;
      border-radius: 9px !important;
      color: white !important;
      background: var(--blue) !important;
      font: inherit;
      font-weight: 750 !important;
      cursor: pointer;
    }
    .save-plan-btn:disabled { opacity: .6; cursor: wait; }
    .cancel-plan-btn {
      padding: 10px 16px !important;
      border: 1px solid #d7e0eb !important;
      border-radius: 9px !important;
      background: white !important;
      color: #16233B !important;
      font: inherit;
      font-weight: 750 !important;
      cursor: pointer;
    }

    #recommendations {
      display: grid;
      gap: 18px;
    }

    .weakness {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
    }

    .weakness-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .weakness h3 { margin: 0; color: #16233B !important; }

    .score {
      padding: 7px 10px;
      border-radius: 8px;
      color: #a04b00;
      background: #fff0da;
      font-size: 12px;
      font-weight: 800;
    }

    .drills {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .drill {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbfcfe;
    }

    .media {
      display: grid;
      aspect-ratio: 16 / 9;
      place-items: center;
      background: var(--navy);
    }

    .media video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .media a {
      padding: 10px 14px;
      border-radius: 8px;
      color: white;
      background: var(--blue);
      text-decoration: none;
      font-weight: 750;
    }

    .drill-content { padding: 14px; }

    #ai-recommendations {
      margin-top: 18px; padding: 22px; border: 1px solid var(--line);
      border-radius: 14px; background: white !important;
    }
    #ai-recommendations h2 { margin: 0 0 4px; color: #16233B !important; }
    .recommendation-source { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
    .focus-area { padding: 16px; border-left: 4px solid #1265ed; border-radius: 8px; background: #f5f8ff; margin-bottom: 12px; }
    .focus-area h3 { font-size: 16px; margin: 0 0 4px; color: #16233B !important; }
    .focus-area p { margin: 0 0 10px; color: #16233B !important; }
    .focus-videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .focus-video { display: block; overflow: hidden; border-radius: 8px; background: white; text-decoration: none; border: 1px solid #e1e7ef; }
    .focus-video img { display: block; width: 100%; height: 100px; object-fit: cover; background: #0b2036; }
    .focus-video-info { padding: 8px 10px; }
    .focus-video-info strong { display: block; font-size: 12.5px; line-height: 1.3; color: #16233B !important; }
    .focus-video-info span { display: block; margin-top: 3px; font-size: 11px; color: #69768a !important; }
    .focus-video-item { display: flex; flex-direction: column; gap: 6px; }
    .add-to-plan-btn {
      padding: 7px 10px !important; border: 1px solid #1265ed !important; border-radius: 6px !important;
      background: white !important; color: #1265ed !important; font-size: 11px; font-weight: 700 !important;
      cursor: pointer; text-align: center;
    }
    .add-to-plan-btn:hover { background: #eef5ff !important; }
    .add-to-plan-btn:disabled { opacity: .7 !important; cursor: default; border-color: #cbd7e4 !important; color: #69768a !important; }
    .add-to-library-btn {
      padding: 7px 10px !important; border: 1px solid #17a957 !important; border-radius: 6px !important;
      background: white !important; color: #17a957 !important; font-size: 11px; font-weight: 700 !important;
      cursor: pointer; text-align: center;
    }
    .add-to-library-btn:hover { background: #eefbf3 !important; }
    .add-to-library-btn:disabled { opacity: .7 !important; cursor: default; border-color: #cbd7e4 !important; color: #69768a !important; }

    #coaching-insights {
      margin-top: 18px; padding: 22px; border: 1px solid var(--line);
      border-radius: 14px; background: white !important;
    }
    #coaching-insights h2 { margin: 0 0 4px; color: #16233B !important; }
    .coaching-insight {
      padding: 14px 16px; border-left: 4px solid #17a957; border-radius: 8px;
      background: #f2fbf6; margin-bottom: 10px;
    }
    .coaching-insight h3 { font-size: 15px; margin: 0 0 4px; color: #16233B !important; }
    .coaching-insight p { margin: 0; color: #16233B !important; font-size: 13.5px; line-height: 1.5; }

    #medicine-notes {
      margin-top: 18px; padding: 22px; border: 1px solid var(--line);
      border-radius: 14px; background: white !important;
    }
    #medicine-notes h2 { margin: 0 0 4px; color: #16233B !important; }
    .medicine-disclaimer {
      margin: 0 0 14px; padding: 10px 12px; border-radius: 8px;
      background: #fff8e6; border: 1px solid #f0dca0; color: #6b5410;
      font-size: 12px; line-height: 1.5;
    }
    .medicine-note {
      padding: 14px 16px; border-left: 4px solid #a04b00; border-radius: 8px;
      background: #fff8f0; margin-bottom: 10px;
    }
    .medicine-note h3 { font-size: 15px; margin: 0 0 4px; color: #16233B !important; }
    .medicine-note p { margin: 0; color: #16233B !important; font-size: 13.5px; line-height: 1.5; }

    .drill h4 { margin: 0 0 7px; }

    .drill p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .state {
      padding: 55px 20px;
      border: 1px dashed #cbd7e4 !important;
      border-radius: 14px;
      color: var(--muted) !important;
      background: white !important;
      text-align: center;
    }

    #page-message {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; height: auto; }
      .summary { grid-template-columns: 1fr; }
      main { padding: 22px 16px 40px; }
    }
  </style>
  <script src="/auth-client.js"></script>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand">
        Kemet FC
        <small>Academy Development</small>
      </div>

      <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/players-dashboard">Players</a>
        <a href="/teams-dashboard">Teams</a>
        <a href="/assessments-dashboard">Assessments</a>
        <a class="active" href="/training-plans-dashboard">
          Training Plans
        </a>
        <a href="/drill-library">Drill Library</a>
        <a href="/videos-dashboard">Videos</a>
        <a href="/matches-dashboard">Matches</a>
              <a id="admin-users-link" href="/admin/users" hidden>Accounts</a>
              <a href="/registrations-dashboard">Assessment Registrations</a>
              <a href="/messages-page">Messaging <span class="nav-badge" id="messaging-badge" hidden></span></a>
      </nav>
    </aside>

    <main>
      <header>
        <div>
          <h1>Training Plan Details</h1>
          <p>Player weaknesses and recommended development drills.</p>
        </div>
        <a class="back" href="/training-plans-dashboard">
          ← All training plans
        </a>
      </header>

      <p id="page-message" role="status"></p>

      <section id="plan-details">
        <div class="state">Loading training plan...</div>
      </section>
    </main>
  </div>

  <script>
    const details = document.querySelector("#plan-details");
    const message = document.querySelector("#page-message");
    const planId = new URLSearchParams(location.search).get("plan_id");

    function make(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function makeStatusSelect(plan) {
      const select = document.createElement("select");

      for (const value of [
        "draft",
        "active",
        "completed",
        "cancelled",
      ]) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent =
          value.charAt(0).toUpperCase() + value.slice(1);
        option.selected = plan.status === value;
        select.append(option);
      }

      select.addEventListener("change", async () => {
        message.textContent = "Updating plan status...";

        try {
          const response = await fetch(
            `/training-plans/${encodeURIComponent(plan.plan_id)}/status`,
            {
              method: "PATCH",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({status: select.value}),
            }
          );

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || "Could not update status.");
          }

          plan.status = data.status;
          message.textContent =
            `Plan updated to ${data.status}.`;
        } catch (error) {
          message.textContent = error.message;
          select.value = plan.status;
        }
      });

      return select;
    }

    function makeEditPlanForm(plan) {
      const form = make("div", "edit-plan-form");
      form.hidden = true;

      form.append(make("label", "", "Player difficulty"));
      const difficultySelect = document.createElement("select");
      for (const value of ["beginner", "intermediate", "advanced"]) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent =
          value.charAt(0).toUpperCase() + value.slice(1);
        option.selected = plan.player_difficulty === value;
        difficultySelect.append(option);
      }
      form.append(difficultySelect);

      form.append(make("label", "", "Target duration (minutes)"));
      const durationInput = document.createElement("input");
      durationInput.type = "number";
      durationInput.min = "1";
      durationInput.value = plan.target_duration;
      form.append(durationInput);

      form.append(make("label", "", "Available equipment (comma-separated)"));
      const equipmentInput = document.createElement("input");
      equipmentInput.type = "text";
      equipmentInput.value = plan.available_equipment.join(", ");
      form.append(equipmentInput);

      const actions = make("div", "edit-plan-actions");
      const saveButton = make("button", "save-plan-btn", "Save changes");
      saveButton.type = "button";
      const cancelButton = make("button", "cancel-plan-btn", "Cancel");
      cancelButton.type = "button";
      cancelButton.addEventListener("click", () => {
        form.hidden = true;
      });

      saveButton.addEventListener("click", async () => {
        saveButton.disabled = true;
        saveButton.textContent = "Saving...";

        try {
          const response = await fetch(
            `/training-plans/${encodeURIComponent(plan.plan_id)}`,
            {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                player_difficulty: difficultySelect.value,
                target_duration: Number(durationInput.value),
                available_equipment: equipmentInput.value
                  .split(",")
                  .map((item) => item.trim())
                  .filter(Boolean),
              }),
            }
          );

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data.detail || "Could not update plan.");
          }

          message.textContent = "Plan updated.";
          await loadPlan();
        } catch (error) {
          saveButton.disabled = false;
          saveButton.textContent = "Save changes";
          message.textContent = error.message;
        }
      });

      actions.append(saveButton, cancelButton);
      form.append(actions);
      return form;
    }

    function makeDrill(drill) {
      const card = make("article", "drill");
      const media = make("div", "media");

      if (drill.video_url?.startsWith("/uploads/drills/")) {
        const video = document.createElement("video");
        video.src = drill.video_url;
        video.controls = true;
        video.preload = "metadata";
        media.append(video);
      } else if (drill.video_url) {
        const link = make("a", "", "Watch drill ↗");
        link.href = drill.video_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        media.append(link);
      } else {
        media.append(make("span", "", "No video"));
      }

      const content = make("div", "drill-content");
      content.append(make(
        "h4",
        "",
        drill.name || drill.drill_id
      ));
      content.append(make(
        "p",
        "",
        [
          drill.category,
          drill.difficulty,
          drill.duration_minutes
            ? `${drill.duration_minutes} min`
            : null,
        ].filter(Boolean).join(" • ")
      ));

      card.append(media, content);
      return card;
    }

    function render(plan) {
      details.replaceChildren();

      const summary = make("section", "summary");
      const summaryContent = make("div");
      summaryContent.append(make("h2", "", plan.plan_id));
      summaryContent.append(make(
        "p",
        "subtitle",
        `Player ${plan.player_id} • Analysis ${plan.analysis_id}`
      ));

      const meta = make("div", "meta");
      meta.append(make("span", "", plan.player_difficulty));
      meta.append(make(
        "span",
        "",
        `${plan.target_duration} minutes`
      ));
      meta.append(make(
        "span",
        "",
        plan.available_equipment.length
          ? plan.available_equipment.join(", ")
          : "Any equipment"
      ));
      summaryContent.append(meta);

      const statusControl = make("div");
      statusControl.append(make("label", "", "Plan status"));
      statusControl.append(makeStatusSelect(plan));

      const editForm = makeEditPlanForm(plan);

      const planActions = make("div", "plan-actions");
      const editButton = make("button", "edit-plan-btn", "Edit Plan");
      editButton.type = "button";
      editButton.addEventListener("click", () => {
        editForm.hidden = !editForm.hidden;
      });

      const deleteButton = make("button", "delete-plan-btn", "Delete Plan");
      deleteButton.type = "button";
      deleteButton.addEventListener("click", async () => {
        if (!window.confirm(
          `Delete training plan ${plan.plan_id}? This cannot be undone.`
        )) {
          return;
        }

        deleteButton.disabled = true;
        deleteButton.textContent = "Deleting...";

        try {
          const response = await fetch(
            `/training-plans/${encodeURIComponent(plan.plan_id)}`,
            { method: "DELETE" }
          );

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data.detail || "Could not delete training plan.");
          }

          window.location.href = "/training-plans-dashboard";
        } catch (error) {
          deleteButton.disabled = false;
          deleteButton.textContent = "Delete Plan";
          message.textContent = error.message;
        }
      });

      planActions.append(editButton, deleteButton);
      statusControl.append(planActions);

      summary.append(summaryContent, statusControl);
      details.append(summary, editForm);

      const recommendations = make("section");
      recommendations.id = "recommendations";

      if (!plan.recommendations.length) {
        recommendations.append(
          make("div", "state", "No recommendations in this plan.")
        );
      }

      for (const item of plan.recommendations) {
        const group = make("article", "weakness");
        const groupHeader = make("div", "weakness-header");
        groupHeader.append(make("h3", "", item.weakness));
        groupHeader.append(make(
          "span",
          "score",
          typeof item.weakness_score === "number"
            ? `Score ${item.weakness_score}`
            : "AI-suggested"
        ));
        group.append(groupHeader);

        const drills = make("div", "drills");

        if (!item.drills.length) {
          drills.append(
            make("div", "state", "No suitable drills found.")
          );
        } else {
          for (const drill of item.drills) {
            drills.append(makeDrill(drill));
          }
        }

        group.append(drills);
        recommendations.append(group);
      }

      details.append(recommendations);

      const aiSection = make("section");
      aiSection.id = "ai-recommendations";
      aiSection.hidden = true;
      aiSection.append(make("h2", "", "AI-Suggested Training"));
      const aiBody = make("div");
      aiBody.id = "ai-recommendations-body";
      aiSection.append(aiBody);
      details.append(aiSection);

      const medicineSection = make("section");
      medicineSection.id = "medicine-notes";
      medicineSection.hidden = true;
      medicineSection.append(
        make("h2", "", "Sports Medicine Notes (AI, General Guidance)")
      );
      const medicineBody = make("div");
      medicineBody.id = "medicine-notes-body";
      medicineSection.append(medicineBody);
      details.append(medicineSection);

      const coachingSection = make("section");
      coachingSection.id = "coaching-insights";
      coachingSection.hidden = true;
      coachingSection.append(
        make("h2", "", "Elite Coaching Insights (AI)")
      );
      const coachingBody = make("div");
      coachingBody.id = "coaching-insights-body";
      coachingSection.append(coachingBody);
      details.append(coachingSection);

      loadSmartRecommendations(plan.player_id);
      loadSportsMedicineNotes(plan.player_id);
      loadCoachingInsights(plan.player_id);
    }

    function renderSmartRecommendations(result) {
      const container = document.querySelector("#ai-recommendations-body");
      const section = document.querySelector("#ai-recommendations");
      container.replaceChildren();
      section.hidden = false;

      const note = make(
        "p",
        "recommendation-source",
        result.source === "analysis"
          ? "AI-suggested based on the latest video analysis."
          : "AI-suggested based on this player's profile (no video analysis yet)."
      );
      container.append(note);

      result.focus_areas.forEach((area) => {
        const box = make("div", "focus-area");
        box.append(make("h3", "", area.title || "Focus area"));
        if (area.reason) box.append(make("p", "", area.reason));

        if (area.videos?.length) {
          const grid = make("div", "focus-videos");
          area.videos.forEach((video) => {
            const item = make("div", "focus-video-item");
            const link = document.createElement("a");
            link.className = "focus-video";
            link.href = video.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            if (video.thumbnail_url) {
              const thumb = document.createElement("img");
              thumb.src = video.thumbnail_url;
              thumb.alt = "";
              link.append(thumb);
            }

            const info = make("div", "focus-video-info");
            info.append(make("strong", "", video.title || "Watch video"));
            if (video.channel) info.append(make("span", "", video.channel));
            link.append(info);
            item.append(link);

            const addButton = make("button", "add-to-plan-btn", "+ Add to plan");
            addButton.type = "button";
            addButton.addEventListener("click", async () => {
              addButton.disabled = true;
              addButton.textContent = "Adding...";

              try {
                const response = await fetch(
                  `/training-plans/${encodeURIComponent(planId)}/recommendations/videos`,
                  {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      weakness: area.title || "Focus area",
                      title: video.title || "Training video",
                      url: video.url,
                      channel: video.channel || null,
                      thumbnail_url: video.thumbnail_url || null,
                    }),
                  }
                );

                if (!response.ok) {
                  const data = await response.json().catch(() => ({}));
                  throw new Error(data.detail || "Could not add video to plan.");
                }

                addButton.textContent = "Added ✓";
                await loadPlan();
              } catch (error) {
                addButton.disabled = false;
                addButton.textContent = "+ Add to plan";
                message.textContent = error.message;
              }
            });
            item.append(addButton);

            const libraryButton = make(
              "button",
              "add-to-library-btn",
              "+ Add to Library"
            );
            libraryButton.type = "button";
            libraryButton.addEventListener("click", async () => {
              libraryButton.disabled = true;
              libraryButton.textContent = "Adding...";

              try {
                const response = await fetch("/drills", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    name: video.title || "Training video",
                    category: area.title || "General",
                    description: video.channel
                      ? `AI-suggested video via ${video.channel}`
                      : "AI-suggested training video",
                    min_age: 6,
                    max_age: 17,
                    difficulty: "beginner",
                    duration_minutes: 10,
                    equipment: [],
                    video_url: video.url,
                    active: true,
                  }),
                });

                if (!response.ok) {
                  const data = await response.json().catch(() => ({}));
                  throw new Error(
                    data.detail || "Could not add video to the drill library."
                  );
                }

                libraryButton.textContent = "Added to Library ✓";
              } catch (error) {
                libraryButton.disabled = false;
                libraryButton.textContent = "+ Add to Library";
                message.textContent = error.message;
              }
            });
            item.append(libraryButton);

            grid.append(item);
          });
          box.append(grid);
        } else {
          box.append(make(
            "p",
            "recommendation-source",
            "No videos available right now — try again later."
          ));
        }

        container.append(box);
      });
    }

    async function loadSmartRecommendations(playerId) {
      try {
        const response = await fetch(
          `/players/${encodeURIComponent(playerId)}/smart-recommendations`
        );

        if (!response.ok) return;

        const result = await response.json();
        if (!result.focus_areas?.length) return;

        renderSmartRecommendations(result);
      } catch (error) {
        // Keep the rule-based recommendations already shown.
      }
    }

    function renderSportsMedicineNotes(result) {
      const container = document.querySelector("#medicine-notes-body");
      const section = document.querySelector("#medicine-notes");
      container.replaceChildren();
      section.hidden = false;

      const disclaimer = make(
        "p",
        "medicine-disclaimer",
        "General, educational information only — not a diagnosis or " +
          "treatment plan. A licensed sports medicine professional should " +
          "evaluate the athlete in person before any medical decisions."
      );
      container.append(disclaimer);

      result.notes.forEach((item) => {
        const box = make("div", "medicine-note");
        box.append(make("h3", "", item.title || "Note"));
        if (item.note) box.append(make("p", "", item.note));
        container.append(box);
      });
    }

    async function loadSportsMedicineNotes(playerId) {
      try {
        const response = await fetch(
          `/players/${encodeURIComponent(playerId)}/sports-medicine-notes`
        );

        if (!response.ok) return;

        const result = await response.json();
        if (!result.notes?.length) return;

        renderSportsMedicineNotes(result);
      } catch (error) {
        // No sports medicine notes available; leave the section hidden.
      }
    }

    function renderCoachingInsights(result) {
      const container = document.querySelector("#coaching-insights-body");
      const section = document.querySelector("#coaching-insights");
      container.replaceChildren();
      section.hidden = false;

      result.insights.forEach((item) => {
        const box = make("div", "coaching-insight");
        box.append(make("h3", "", item.title || "Insight"));
        if (item.insight) box.append(make("p", "", item.insight));
        container.append(box);
      });
    }

    async function loadCoachingInsights(playerId) {
      try {
        const response = await fetch(
          `/players/${encodeURIComponent(playerId)}/coaching-insights`
        );

        if (!response.ok) return;

        const result = await response.json();
        if (!result.insights?.length) return;

        renderCoachingInsights(result);
      } catch (error) {
        // No coaching insights available; leave the section hidden.
      }
    }

    async function loadPlan() {
      if (!planId) {
        details.replaceChildren(
          make(
            "div",
            "state",
            "Choose a training plan from the Training Plans page."
          )
        );
        return;
      }

      try {
        const response = await fetch(
          `/training-plans/${encodeURIComponent(planId)}`
        );
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Could not load plan.");
        }

        render(data);
      } catch (error) {
        message.textContent = error.message;
        details.replaceChildren(
          make("div", "state", "Training plan is unavailable.")
        );
      }
    }

    loadPlan();
  </script>
</body>
</html>
