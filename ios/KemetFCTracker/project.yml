# XcodeGen project spec — generates KemetFCTracker.xcodeproj from this
# text file plus Sources/Info.plist, so the project is versioned as
# plain text (spec: "make the iOS code a real openable Xcode project").
#
# Phase 3: this machine now has full Xcode (27.0) — `xcodegen generate`
# HAS been run here, producing a real KemetFCTracker.xcodeproj that
# genuinely built successfully against the real iOS 27.0 device SDK
# (`xcodebuild build ... -sdk iphoneos`, BUILD SUCCEEDED) after fixing
# ~15 real compile/concurrency/API errors the build found — see the
# Phase 3 field-readiness report for the full list. No iOS Simulator
# runtime could be installed on this machine (insufficient disk: 8.07GB
# required, 7.4GB free) — and separately, DockKit does not exist on the
# iOS Simulator SDK at all, so this app can NEVER build for Simulator
# regardless of disk space; only a physical-device SDK build is
# possible. No physical iPhone or Flow 2 Pro were connected in this
# environment either. On a Mac with more disk space or a connected
# device:
#
#   brew install xcodegen   # if not already installed
#   cd ios/KemetFCTracker
#   xcodegen generate
#   open KemetFCTracker.xcodeproj
#
# If XcodeGen is unavailable, see README.md's "Manual Xcode project"
# fallback instructions instead.

name: KemetFCTracker
options:
  bundleIdPrefix: com.kemetfc
  deploymentTarget:
    iOS: "17.4" # DockKit's Insta360-recommended minimum (see DockKitManager.swift header)

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  KemetFCTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        # Portrait only — matches the existing Vision/pose-detection code,
        # which passes `orientation: .right` (the standard
        # CGImagePropertyOrientation for a back camera held with the
        # device upright/portrait) in PlayerDetector.swift. Do not add
        # landscape here without also updating that orientation argument.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "KEMET FC uses the camera to record player assessments and track the player being evaluated."
        ITSAppUsesNonExemptEncryption: false
        # Phase 3 finding: README.md's own documented on-field workflow
        # (KEMET_BACKEND_BASE_URL = http://<mac-LAN-IP>:8010 for testing
        # against a laptop) would be silently blocked by App Transport
        # Security on a real device without this — ATS refuses plain
        # HTTP by default. NSAllowsLocalNetworking (iOS 10+) scopes the
        # exception to literal IP addresses/.local hosts ONLY — it does
        # NOT disable ATS for the internet at large the way
        # NSAllowsArbitraryLoads would, so production traffic to
        # https://app.kemetfc.com is unaffected and still fully
        # ATS-protected.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Required alongside NSAllowsLocalNetworking above — iOS 14+
        # shows its system "find and connect to devices on your local
        # network" permission prompt for ANY request to a LAN IP
        # (including a plain URLSession call, not just Bonjour/mDNS
        # discovery), and without this description key the request can
        # fail rather than prompt. Needed for the same on-field
        # KEMET_BACKEND_BASE_URL=http://<mac-LAN-IP>:port workflow.
        NSLocalNetworkUsageDescription: "KEMET FC connects to the coach's laptop on the same WiFi network during on-field testing to upload assessment videos and tracking data."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kemetfc.tracker
        TARGETED_DEVICE_FAMILY: "1" # iPhone only — DockKit accessories (Flow 2 Pro) are phone-mounted, no iPad support claimed
        IPHONEOS_DEPLOYMENT_TARGET: "17.4"
        CODE_SIGN_STYLE: Automatic
        # Karim Elsayed's Apple ID Personal Team. NOT HU277BUGLJ (a STALE
        # team ID from before this account was removed and re-added in
        # Xcode's Accounts settings during earlier troubleshooting —
        # Apple issued a new Personal Team ID afterward). Confirmed
        # current via a genuinely-issued, unexpired provisioning profile
        # (~/Library/Developer/Xcode/UserData/Provisioning Profiles/,
        # "iOS Team Provisioning Profile: com.kemetfc.tracker", team
        # JHA8GPK7C5) — never guessed. Every prior "No Account for Team
        # HU277BUGLJ" / "No profiles found" failure was this file
        # overwriting Xcode's own correct live resolution back to the
        # wrong team on every `xcodegen generate`. Replace with the paid
        # Apple Developer Program team ID once that membership is active
        # (see README's signing section) — Personal Team profiles expire
        # in 7 days and are locally-scoped, not portal-registered.
        DEVELOPMENT_TEAM: JHA8GPK7C5
    dependencies: []

  KemetFCTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Tests
    dependencies:
      - target: KemetFCTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kemetfc.tracker.tests
        DEVELOPMENT_TEAM: JHA8GPK7C5
        CODE_SIGN_STYLE: Automatic
        # `xcodebuild test` (unlike a plain `build` of the app target
        # alone) actually code-signs this bundle too, which fails
        # without an Info.plist — XCTest bundles don't need a real one
        # checked in, just this auto-generation flag.
        GENERATE_INFOPLIST_FILE: YES
        # DockKitManager (via the KemetFCTracker dependency) needs the real
        # device SDK — DockKit doesn't exist on macOS/Catalyst or Simulator —
        # so this target must not offer a Mac destination.
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1"
